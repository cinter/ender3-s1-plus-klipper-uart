# This file contains pin mappings for the stock 2022 Creality Ender 3
# S1 Plus. To use this config check the STM32 Chip on the Mainboard,
# during "make menuconfig" select accordingly either the
# STM32F103 with "28KiB bootloader" or the STM32F401 with
# "64KiB bootloader" and serial (on USART1 PA10/PA9) for both.

# For a direct serial connection, in "make menuconfig" select
# "Enable extra low-level configuration options" and  Serial
# (on USART2 PA3/PA2), which is on the 10 pin IDC cable used
# for the LCD module as follows: 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The filename
# must be changed to "firmware.bin"

# With STM32F401, you might need to put "firmware.bin" in a
# folder on the SD card called "STM32F4_UPDATE" in order to flash.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include bedtime.cfg]
[include filament.cfg]

# Enable object labels and cancellation from OrcaSlicer.
[exclude_object]

# Tuning imported from SETTINGS.GCO (Marlin) on 2026-10-16.
# Imported PID, probe Z offset, pressure advance and shaping are starting
# values; verify/calibrate them in Klipper after connecting the printer.
# M206 home offsets, M205 jerk and firmware-specific M19 commands are not
# translated. See MARLIN-IMPORT.md for the full mapping and limitations.

[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -10
position_max: 316
position_min: -15
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA6
position_endstop: -10
position_max: 304
position_min: -15
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 300
position_min: -4

[extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
gear_ratio: 42:12
# M92 E424.9: 200 * 16 * (42/12) / 424.9 = 26.359143 mm.
rotation_distance: 26.359
max_extrude_only_velocity: 50
max_extrude_only_accel: 1000
# Measured 2026-10-17: best corners at 17.5 mm, PA = Z * 0.005.
pressure_advance: 0.0875
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
# Marlin M301; rerun PID_CALIBRATE when the printer is connected.
#pid_Kp: 28.30
#pid_Ki: 3.08
#pid_Kd: 65.09
min_temp: 0
max_temp: 260

[heater_bed]
heater_pin: PA7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
# Marlin M304; rerun PID_CALIBRATE when the printer is connected.
pid_Kp: 55.97
pid_Ki: 9.55
pid_Kd: 218.8
min_temp: 0
max_temp: 100

[heater_fan hotend_fan]
pin: PC0

[fan]
pin: PA0

[mcu]
serial: /dev/serial0
baud: 250000
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
# Marlin M204 print/travel default is 500; M201 XY ceiling was 1000.
max_accel: 500
max_z_velocity: 10
max_z_accel: 100

[input_shaper]
# Printed ringing measurement 2026-10-17, 80 mm/s, 5 spacings:
# Left wall (X): 12 mm -> 33.3 Hz; front wall (Y): 11 mm -> 36.4 Hz.
# MZV is the first comparison candidate; verify with the shaped test.
shaper_type: mzv
shaper_freq_x: 33.3
shaper_freq_y: 36.4
# Damping remains the provisional imported estimate for this comparison.
damping_ratio_x: 0.15
damping_ratio_y: 0.15

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
x_offset: -48
y_offset: 0
# Marlin M851 Z-2.87 uses the opposite sign to Klipper's trigger height.
# Provisional until PROBE_CALIBRATE is completed on the actual printer.
#z_offset: 2.87
probe_with_touch_mode: true
stow_on_each_sample: false

[bed_mesh]
speed: 120
mesh_min: 20, 20
# Nozzle X = probe X - x_offset; 268 - (-48) = X max 316.
mesh_max: 268, 263
probe_count: 4,4
algorithm: bicubic

[safe_z_home]
home_xy_position: 187, 192
speed: 75
z_hop: 10
z_hop_speed: 5

[filament_switch_sensor e0_sensor]
switch_pin: !PC15
pause_on_runout: true
runout_gcode: PAUSE

[pause_resume]
recover_velocity: 25

# OrcaSlicer Generic Klipper profile entry points.
[gcode_macro PRINT_START]
description: Heat, home, load the saved mesh and prime for OrcaSlicer
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set hotend = params.EXTRUDER|default(210)|float %}
    {% if bed < 0 or bed > 100 or hotend < 170 or hotend > 260 %}
        {action_raise_error("PRINT_START: temperature outside configured limits")}
    {% endif %}
    M220 S100
    M221 S100
    G90
    M83
    M107
    BED_MESH_CLEAR
    M140 S{bed}
    M104 S150
    M190 S{bed}
    G28
    BED_MESH_PROFILE LOAD=pla-60
    G1 Z10 F600
    G1 X30 Y30 F3000
    M109 S{hotend}
    G92 E0
    G1 Z0.28 F300
    G1 X30 Y180 E10 F900
    G92 E0
    G1 Z2 F600

[gcode_macro PRINT_END]
description: OrcaSlicer alias for the existing end routine
gcode:
    END_PRINT

[gcode_macro END_PRINT]
description: Retract, lift up to 10 mm, park X0/Y300, shut down and release motors
gcode:
    M400
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-1 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M107
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set room = [0.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z - 1.0]|max %}
        {% set lift = [10.0, room]|min %}
        G91
        G1 Z{lift} F600
        G90
        G1 X0 Y300 F3000
        M400
    {% else %}
        { action_respond_info("END_PRINT: axes not homed; skipped lift and parking.") }
    {% endif %}
    G90
    M82
    M84

