# Runtime-only quiet mode. Restart resets mode to off.
[gcode_macro BEDTIME_MODE]
description: Toggle Bedtime Mode (40 mm/s, 250 mm/s^2, gentle corners)
variable_active: 0
variable_saved_velocity: 300.0
variable_saved_accel: 500.0
variable_saved_corner: 5.0
gcode:
    {% if printer["gcode_macro BEDTIME_MODE"].active|int %}
        _BEDTIME_MODE_OFF
    {% else %}
        _BEDTIME_MODE_ON
    {% endif %}

[gcode_macro _BEDTIME_MODE_ON]
description: Enable quiet motion; save current limits once
gcode:
    {% if not printer["gcode_macro BEDTIME_MODE"].active|int %}
        SET_GCODE_VARIABLE MACRO=BEDTIME_MODE VARIABLE=saved_velocity VALUE={printer.toolhead.max_velocity}
        SET_GCODE_VARIABLE MACRO=BEDTIME_MODE VARIABLE=saved_accel VALUE={printer.toolhead.max_accel}
        SET_GCODE_VARIABLE MACRO=BEDTIME_MODE VARIABLE=saved_corner VALUE={printer.toolhead.square_corner_velocity}
        SET_GCODE_VARIABLE MACRO=BEDTIME_MODE VARIABLE=active VALUE=1
        _BEDTIME_ENFORCE
        {action_respond_info("Bedtime Mode ON: up to 40 mm/s, 250 mm/s^2, corner velocity 2 mm/s.")}
    {% else %}
        {action_respond_info("Bedtime Mode is already ON.")}
    {% endif %}

[gcode_macro _BEDTIME_MODE_OFF]
description: Disable quiet motion and restore saved limits
gcode:
    {% set mode = printer["gcode_macro BEDTIME_MODE"] %}
    {% if mode.active|int %}
        SET_GCODE_VARIABLE MACRO=BEDTIME_MODE VARIABLE=active VALUE=0
        _BEDTIME_SET_VELOCITY_LIMIT VELOCITY={mode.saved_velocity} ACCEL={mode.saved_accel} SQUARE_CORNER_VELOCITY={mode.saved_corner}
        {action_respond_info("Bedtime Mode OFF: previous motion limits restored.")}
    {% else %}
        {action_respond_info("Bedtime Mode is already OFF.")}
    {% endif %}

[gcode_macro _BEDTIME_ENFORCE]
gcode:
    {% if printer["gcode_macro BEDTIME_MODE"].active|int %}
        _BEDTIME_SET_VELOCITY_LIMIT VELOCITY={[printer.toolhead.max_velocity, 40.0]|min} ACCEL={[printer.toolhead.max_accel, 250.0]|min} SQUARE_CORNER_VELOCITY={[printer.toolhead.square_corner_velocity, 2.0]|min}
    {% endif %}

# Reapply caps immediately after slicer/runtime changes, before the next move.
[gcode_macro SET_VELOCITY_LIMIT]
rename_existing: _BEDTIME_SET_VELOCITY_LIMIT
gcode:
    _BEDTIME_SET_VELOCITY_LIMIT {rawparams}
    _BEDTIME_ENFORCE

[gcode_macro M204]
rename_existing: M204.1
gcode:
    M204.1 {rawparams}
    _BEDTIME_ENFORCE
